[workspace]
resolver = "2"
members = ["crates/core", "crates/theme", "crates/app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tanmaypanda-14/msi-center-rust"

# Small, fast single binary: no debug info, whole-program LTO, abort on panic.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace.dependencies]
thiserror = "2"

[package]
name = "msi-center"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "msi-center"
path = "src/main.rs"

[dependencies]
msi-core = { path = "../core" }
msi-theme = { path = "../theme" }
# Software renderer only: no OpenGL/femtovg, no accessibility bridge, smaller
# and lighter for a static dashboard UI.
slint = { version = "1", default-features = false, features = [
    "std",
    "backend-winit-wayland",
    "renderer-software",
    "compat-1-2",
] }
thiserror.workspace = true

[build-dependencies]
slint-build = "1"

# ec_sys exposes the raw EC image in debugfs. msi-center only reads the fan
# tachometer at 0xCC/0xCD, so write support stays off.
options ec_sys write_support=0

# The fan helper needs a raw-write node. msi-ec only creates debug/ec_set with
# debug=1, and only root may write it - which is exactly the boundary we want:
# msi-fan-helper is setuid root and accepts a fan speed, never an address, so
# the only EC bytes it can touch are the seven curve speeds at 0x72..0x78.
# Without this line "manual fan speed" is unavailable and everything else in
# the app keeps working.
options msi_ec debug=1

# debugfs creates ec0/io with 0400 root:root, and a module reload recreates
# it after any earlier tmpfiles grant. Re-apply the read-only group grant
# immediately after every load (boot, manual modprobe -r + modprobe, DKMS
# rebuild). --ignore-install prevents recursion into this hook.
install ec_sys /usr/bin/modprobe --ignore-install ec_sys $CMDLINE_OPTS && { /usr/bin/systemd-tmpfiles --create /usr/lib/tmpfiles.d/msi-ec.conf || true; }

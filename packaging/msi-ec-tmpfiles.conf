# Read-only access to the raw EC image for the `msi-ec` group.
#
# Used by msi-center to compute fan RPM from the tachometer ticks at
# 0xCC/0xCD (480000 / ticks). 0640, no write bit: reading the tachometer is
# all the app needs, and nothing outside root can poke other EC registers.
#
# ec_sys must be loaded first: /etc/modprobe.d/msi-ec-ec_sys.conf
#   options ec_sys write_support=0

m /sys/kernel/debug      0750 root msi-ec -
m /sys/kernel/debug/ec   0750 root msi-ec -
m /sys/kernel/debug/ec/ec0 0750 root msi-ec -
m /sys/kernel/debug/ec/ec0/io 0640 root msi-ec -

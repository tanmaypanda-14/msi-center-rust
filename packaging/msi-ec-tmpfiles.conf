# Read-only access to the raw EC image for the `msi-ec` group.
#
# Used to compute fan RPM from the tachometer ticks at 0xCC/0xCD
# (480000 / ticks). 0640 on the image: read-only, never writable.
#
# 0710 on the directories: the group may traverse to the tachometer but
# cannot list debugfs. Root keeps full access. This is deliberately tighter
# than the old 0750 grant.
#
# /sys/kernel/debug is mounted by sys-kernel-debug.mount, which is not
# ordered against systemd-modules-load, so msi-ec-perms.service re-applies
# this after both are up. The ec_sys modprobe hook re-applies it after any
# manual module reload.

m /sys/kernel/debug 0710 root msi-ec -
m /sys/kernel/debug/ec 0710 root msi-ec -
m /sys/kernel/debug/ec/ec0 0710 root msi-ec -
m /sys/kernel/debug/ec/ec0/io 0640 root msi-ec -
